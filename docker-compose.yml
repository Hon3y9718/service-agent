services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cs_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  app:
    build: .
    env_file: .env
    environment:
      # Inside the compose network the DB is reachable by service name, not localhost -
      # overrides whatever host-oriented DATABASE_URL is in .env.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cs
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
